openapi: 3.0.2
info:
  version: 3.0.0
  title: Kensho Extract annotations-async Line Item API
  description: "Kensho Extract allows users to quickly transform their unstructured documents into a machine-readable format\
    \ that identifies titles, subtitles, paragraphs, tables, and footers detected within the document in their natural reading\
    \ order. \nKensho Extract interprets messy page layout, structuring text into cohesive paragraphs that can be effectively\
    \ analyzed and searched. <br><br> The Kensho Extract API V3 has incorporated changes to how users must call the API.\n\
    Please note there are more required fields in API V3 than API V2 (deprecated). The following fields are *mandatory* for\
    \ `/v3/extractions`: file, document_type, ocr and enhanced_table_extraction. <br><br> API V3 introduces new upload and\
    \ download functionality, allowing the upload of the original document and retrieval of the extracted document output\
    \ via pre-signed URLs. The pre-signed URLs expire after 15 minutes. <br> These new endpoints must be called in the following\
    \ order.\n  - `/v3/extractions/upload-url`\n    - followed by POST'ing the document to the `url` provided in the response\n\
    \  - `/v3/extractions/upload-complete`\n  - `/v3/extractions/download-url/{request_id}`\n    - followed by a calling the\
    \ GET `output_url` provided in the response\n"
servers:
- url: https://kfinance.kensho.com
tags:
- name: Line Item
paths:
  /api/v1/line_item/:
    post:
      operationId: Get Financial Line Item
      description: 'Get a financial line item for a set of company_ids.


        For a public company, the annual period_type returns annual calendar year values. For a private company, the annual
        period_type returns annual fiscal year values.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinancialItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinancialItemRequest'
        required: true
      security:
      - cookieAuth: []
      - Kensho_JWT_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialItemResponse'
              examples:
                Plant,Property,AndEquipmentLineItemExample:
                  value:
                    results:
                      '24937':
                        currency: USD
                        periods:
                          FY2023Q1:
                            period_end_date: '2022-12-31'
                            num_months: 3
                            line_item:
                              name: Net Property Plant And Equipment
                              value: '42951000000.000000'
                              sources:
                              - type: doc-viewer line item
                                url: https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=217403557&uctSearch=42951.000000
                          FY2023Q2:
                            period_end_date: '2023-04-01'
                            num_months: 3
                            line_item:
                              name: Net Property Plant And Equipment
                              value: '43398000000.000000'
                              sources:
                              - type: doc-viewer line item
                                url: https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=222795059&uctSearch=43398.000000
                          FY2023Q3:
                            period_end_date: '2023-07-01'
                            num_months: 3
                            line_item:
                              name: Net Property Plant And Equipment
                              value: '43550000000.000000'
                              sources:
                              - type: doc-viewer line item
                                url: https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=228080297&uctSearch=43550.000000
                          FY2023Q4:
                            period_end_date: '2023-09-30'
                            num_months: 3
                            line_item:
                              name: Net Property Plant And Equipment
                              value: '43715000000.000000'
                              sources:
                              - type: doc-viewer statement
                                url: https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=232134583
                    errors: {}
                  summary: '24937'
                PrivateCompanyRevenueExample:
                  value:
                    results:
                      '1861276':
                        currency: SEK
                        periods:
                          PED2023-08-31:
                            period_end_date: '2023-08-31'
                            num_months: 12
                            line_item:
                              name: Revenues
                              value: '34550436000.000000'
                              sources: []
                    errors: {}
                  summary: '1861276'
          description: Indicates a successful request.
        '400':
          description: Indicates that the input parameters are invalid.
        '403':
          description: Indicates that the authorization information is missing or invalid.
      tags:
      - Line Item
  /api/v1/line_item/{company_id}/{line_item}/{period_type}/{start_year}/{end_year}/{start_quarter}/{end_quarter}:
    get:
      operationId: Get Financial Line Item_2
      description: 'Get a financial line item for a given company_id.


        For a public company, the annual period_type returns annual calendar year values. For a private company, the annual
        period_type returns annual fiscal year values.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: end_quarter
        schema:
          type: string
          pattern: ^([1-4])|(?i:none)|(?i:null)$
        required: true
      - in: path
        name: end_year
        schema:
          type: string
          pattern: ^([0-9]{4})|(?i:none)|(?i:null)$
        required: true
      - in: path
