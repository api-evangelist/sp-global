server:
  name: spglobal-kfinance
  description: 'Hosted (remote) MCP server for the S&P Global LLM-Ready API (kFinance), operated by Kensho.
    Documented first-class integrations: Claude (Desktop/Cowork/Code), ChatGPT, Microsoft Copilot Studio,
    Amazon Quick Suite, Databricks, and Mistral (Beta). The kensho-kfinance Python package also runs a
    local MCP server (python -m kfinance.mcp) with stdio, SSE, and streamable-http transports.'
  transport: http
  url: https://kfinance.kensho.com/integrations/mcp
  local:
    install: pip install kensho-kfinance
    run: python -m kfinance.mcp [--stdio|-s] [--sse] [--streamable-http]
    transports:
    - stdio
    - sse
    - streamable-http
  authentication:
    type: oauth2
    authorization_server: https://kfinance.kensho.com/integrations
    metadata: well-known/sp-global-oauth-authorization-server.json
    protected_resource_metadata: well-known/sp-global-oauth-protected-resource.json
    dynamic_client_registration: https://kfinance.kensho.com/integrations/register
    pkce: S256
    scopes:
    - kensho:app:kfinance
    - offline_access
    notes: 'Live tools/list introspection on the hosted endpoint returns 401 invalid_token (OAuth-gated);
      clients auto-register via RFC 7591 dynamic client registration and complete an authorization_code
      + PKCE flow. Local server auth: refresh token (development, expires after 7 days) or client-id +
      private-key keypair (production).'
  registry_config:
    source: https://github.com/kensho-technologies/spglobal-agent-skills/blob/main/plugins/spglobal-plugin/.mcp.json
    mcpServers:
      spglobal:
        type: http
        url: https://kfinance.kensho.com/integrations/mcp
