                              - name: Operating Income
                                value: '114301000000.000000'
                              - name: Other Non Operating Expenses, Total
                                value: '-565000000.000000'
                              - name: Other Non Operating Income (Expenses)
                                value: '-565000000.000000'
                              - name: EBT, Excl. Unusual Items
                                value: '113736000000.000000'
                              - name: EBT, Incl. Unusual Items
                                value: '113736000000.000000'
                              - name: Income Tax Expense
