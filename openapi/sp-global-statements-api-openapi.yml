openapi: 3.2.0
info:
  title: LLM-ready Statements API
  version: 0.1.0
  description: S&P Global Market Intelligence kFinance dataset via LLM-Ready API
servers:
- url: https://kfinance.kensho.com
tags:
- name: Statements
paths:
  /api/v1/statements/:
    post:
      operationId: Get Financial Statement
      description: 'Get a financial statement, such as a balance sheet, income statement, or cashflow statement for a given company_id.


        For a public company, the annual period_type returns annual calendar year values. For a private company, the annual period_type returns annual fiscal year values.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialStatementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinancialStatementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinancialStatementRequest'
        required: true
      security:
      - cookieAuth: []
      - Kensho_JWT_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialStatementResponse'
              examples:
                IncomeStatementExample:
                  value:
                    results:
                      '24937':
                        currency: USD
                        periods:
                          FY2023:
                            period_end_date: '2023-09-30'
                            num_months: 12
                            statements:
                            - name: Income Statement
                              line_items:
                              - name: Revenues
